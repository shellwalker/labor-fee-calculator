[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/batch", "crates/web", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[workspace.dependencies]
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
proptest = "1"
anyhow = "1"

# 测试含大范围遍历，测试构建开启优化以缩短耗时
[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

# 发布构建：单个可执行文件尽量小
[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
