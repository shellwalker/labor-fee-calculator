name: CI

# - PR（目标任意分支）：三平台格式检查 / 静态检查 / 测试，不打包、不发布。
# - push develop：三平台检查 + 打包，并发布“预览版（测试用）”预发布 Release（标签 develop-preview，每次覆盖）。
# - 手动触发：同 develop，但只上传 artifact，不更新预览 Release（除非在 develop 上触发）。
# 正式版本只由 release.yml 在 main 上发布。
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建
    uses: ./.github/workflows/build.yml
    with:
      channel: ${{ github.event_name == 'pull_request' && 'pr' || 'preview' }}
      package: ${{ github.event_name != 'pull_request' }}

  preview:
    name: 发布 develop 预览版
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: develop-preview-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: develop-preview
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ github.sha }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: labor-fee-*
          merge-multiple: true

      - name: 生成校验和
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 更新预览版 Release（develop-preview）
        run: |
          set -euo pipefail
          SHORT="$(printf '%s' "$SHA" | cut -c1-8)"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<NOTES_EOF
          > [!WARNING]
          > **预览版 / 测试版，请勿用于正式核算。** 由 develop 分支自动构建，每次推送 develop 都会覆盖本 Release。
          > 正式版本请到 [Releases](https://github.com/${GH_REPO}/releases/latest) 下载（只由 main 分支发布）。

          - 版本号：\`${VERSION}\`
          - 提交：[\`${SHORT}\`](https://github.com/${GH_REPO}/commit/${SHA})
          - 构建：[Actions 运行记录](https://github.com/${GH_REPO}/actions/runs/${{ github.run_id }})

          | 平台 | 文件 |
          | --- | --- |
          | Windows x86_64 | \`labor-fee-${VERSION}-windows-x86_64.zip\` |
          | macOS Apple Silicon（M 系列） | \`labor-fee-${VERSION}-macos-arm64.zip\`（未签名、未公证，首次打开需右键「打开」） |
          | Linux x86_64 | \`labor-fee-${VERSION}-linux-x86_64.tar.gz\` |

          每个压缩包都含桌面程序 labor-fee-desktop、命令行 labor-fee 与 Web 服务 labor-fee-web。
          NOTES_EOF
          # 预览标签只用于挂载预览产物，每次指向最新的 develop 提交（不涉及分支历史）
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" artifacts/* \
            --target "$SHA" \
            --prerelease \
            --latest=false \
            --title "预览版（测试用）${VERSION}" \
            --notes-file "$NOTES"
          echo "预览版：https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
