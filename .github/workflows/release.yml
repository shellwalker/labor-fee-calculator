name: Release

# 正式发布：只允许 main 分支。
#   - push main：读取 Cargo.toml 的版本号 X.Y.Z；若标签 vX.Y.Z 还没有 Release，则三平台检查、构建并发布正式版，
#     同时创建标签 vX.Y.Z（指向本次 main 提交）。已发布过的版本号自动跳过——要发新版本，先在 develop 上改版本号再合入 main。
#   - push 标签 v*：标签指向的提交必须已在 main 上，且与 Cargo.toml 版本号一致。
#   - 手动触发：只能在 main 上运行，效果同 push main。
# develop / PR 只能通过 ci.yml 产出预览版或检查结果，不能发布正式版。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: 校验发布来源（仅允许 main）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验分支、标签与版本号
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "::error::无法从 Cargo.toml 读取版本号"; exit 1
          fi
          TAG="v$CARGO_VERSION"
          git fetch --no-tags origin main
          COMMIT="$(git rev-parse "${HEAD_SHA}^{commit}")"

          if [ "$REF_TYPE" = "tag" ]; then
            # 标签发布：标签指向的提交必须已经在 main 上，且标签与版本号一致
            if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
              echo "::error::标签 $REF_NAME 指向的提交不在 main 分支上，禁止发布"; exit 1
            fi
            if [ "$REF_NAME" != "$TAG" ]; then
              echo "::error::标签 $REF_NAME 与 Cargo.toml 版本 $CARGO_VERSION 不一致"; exit 1
            fi
          elif [ "$REF" != "refs/heads/main" ]; then
            echo "::error::正式发布只能从 main 分支发起，当前为 $REF"; exit 1
          else
            # push main / 手动触发：若同名标签已存在，必须就是 main 上的提交
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
              TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
              if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
                echo "::error::标签 $TAG 已存在但指向非 main 提交 $TAG_COMMIT；请删除该标签或提升版本号"; exit 1
              fi
              COMMIT="$TAG_COMMIT"
            fi
          fi

          PUBLISH=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG 已发布过，跳过。要发布新版本，请先提升 Cargo.toml 的版本号。"
            PUBLISH=false
          fi
          case "$CARGO_VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac
          echo "版本号：$CARGO_VERSION 标签：$TAG 提交：$COMMIT 预发布：$PRERELEASE 发布：$PUBLISH"
          {
            echo "version=$CARGO_VERSION"
            echo "tag=$TAG"
            echo "prerelease=$PRERELEASE"
            echo "publish=$PUBLISH"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    name: 构建
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/build.yml
    with:
      channel: release
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.commit }}
      package: true

  release:
    name: 发布正式版 GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      TARGET_SHA: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: labor-fee-*
          merge-multiple: true

      - name: 生成校验和
        working-directory: artifacts
        run: |
          set -euo pipefail
          ls -l
          sha256sum -- *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建 Release ${{ env.TAG }}
        run: |
          set -euo pipefail
          ARGS=(--title "劳务报酬计算工具 v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          # 标签不存在时由 gh 在 TARGET_SHA（main 提交）上创建
          gh release create "$TAG" artifacts/* --target "$TARGET_SHA" "${ARGS[@]}"
          echo "正式版：https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
