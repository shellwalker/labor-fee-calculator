<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>劳务报酬计算工具</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; } h2 { font-size: 17px; margin-top: 28px; border-left: 4px solid #2f6fde; padding-left: 8px; }
  section { background: #f7f8fa; border-radius: 8px; padding: 16px; }
  input[type=text] { padding: 6px 8px; width: 180px; font-size: 15px; }
  button { padding: 6px 14px; font-size: 15px; margin-left: 6px; cursor: pointer; }
  table { border-collapse: collapse; margin-top: 12px; min-width: 420px; background: #fff; }
  td { border: 1px solid #ddd; padding: 5px 10px; } td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #11883a; } .warn { color: #c0392b; } .muted { color: #888; font-size: 13px; }
  pre { background: #fff; border: 1px solid #ddd; padding: 10px; max-height: 300px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<h1>劳务报酬计算工具</h1>
<p class="muted">增值税、附加税、劳务报酬个税（预扣预缴）正算 / 反算 / 批量反算。口径以服务端配置为准（见页面底部），默认口径需业务确认。</p>

<h2>单笔计算</h2>
<section>
  <input type="text" id="amount" placeholder="金额（元）">
  <button onclick="calc('forward')">正算（输入企业总成本）</button>
  <button onclick="calc('reverse')">反算（输入实际到手）</button>
  <div id="single"></div>
</section>

<h2>批量反算（xlsx / xls / csv）</h2>
<section>
  <form id="batchForm">
    <input type="file" name="file" accept=".xlsx,.xlsm,.xls,.ods,.csv" required>
    列标题 <input type="text" name="column" value="到手金额" style="width:100px">
    <button type="submit">上传并反算</button>
  </form>
  <p class="muted">读取首行标题为“到手金额”的列，在右侧追加企业总成本、各项税费、校准状态等列，结果文件自动下载。</p>
  <div id="batch"></div>
</section>

<h2>当前口径配置</h2>
<pre id="cfg">加载中…</pre>

<script>
const fmtPct = r => (Number(r) * 100).toFixed(2).replace(/\.?0+$/, '') + '%';
function row(k, v) { return `<tr><td>${k}</td><td class="v">${v}</td></tr>`; }
function render(b) {
  let h = '<table>';
  h += row('企业总成本', b.total_cost);
  h += row('不含税开票收入', b.net_revenue + (b.vat_exempt ? '（未达征收门槛，不征增值税及附加税）' : ''));
  h += row('增值税', b.vat);
  for (const s of b.surcharges) h += row(`${s.name}（${fmtPct(s.rate)}）`, s.amount);
  h += row('附加税合计', b.surcharge_total);
  h += row('收入额', b.iit.income);
  h += row('减除费用', b.iit.deduction);
  h += row('应纳税所得额', b.iit.taxable_income);
  h += row('预扣率', fmtPct(b.iit.rate));
  h += row('速算扣除数', b.iit.quick_deduction);
  h += row('代扣个税', b.iit.tax);
  h += row('<b>实际到手金额</b>', `<b>${b.take_home}</b>`);
  h += '</table>';
  if (Number(b.unallocated) !== 0) h += `<p class="warn">输入总成本无法恰好分解，已按最大有效总成本 ${b.total_cost} 计算，未分配差额 ${b.unallocated}</p>`;
  return h;
}
async function calc(kind) {
  const el = document.getElementById('single');
  const amount = document.getElementById('amount').value.trim();
  if (!amount) { el.innerHTML = '<p class="warn">请输入金额</p>'; return; }
  const resp = await fetch(`/api/${kind}?amount=${encodeURIComponent(amount)}`);
  const data = await resp.json();
  if (!resp.ok) { el.innerHTML = `<p class="warn">${data.error}</p>`; return; }
  if (kind === 'forward') { el.innerHTML = render(data); return; }
  let head = data.exact
    ? '<p class="ok">精确：正算回去与目标到手完全一致</p>'
    : `<p class="warn">不可精确达到，已取最接近的总成本，差额 ${data.diff}（正算到手 − 目标）</p>`;
  if (data.other_solutions && data.other_solutions.length)
    head += `<p class="muted">另有总成本 ${data.other_solutions.join('、')} 亦可精确达到（分段跳变导致多解）</p>`;
  el.innerHTML = head + render(data.breakdown);
}
document.getElementById('amount').addEventListener('keydown', e => { if (e.key === 'Enter') calc('reverse'); });
document.getElementById('batchForm').addEventListener('submit', async e => {
  e.preventDefault();
  const el = document.getElementById('batch');
  el.innerHTML = '<p class="muted">处理中…</p>';
  const resp = await fetch('/api/batch', { method: 'POST', body: new FormData(e.target) });
  if (!resp.ok) { const d = await resp.json().catch(() => ({ error: resp.statusText })); el.innerHTML = `<p class="warn">${d.error}</p>`; return; }
  const cd = resp.headers.get('content-disposition') || '';
  const m = cd.match(/filename\*=UTF-8''([^;]+)/);
  const name = m ? decodeURIComponent(m[1]) : 'result';
  const blob = await resp.blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  const s = Object.fromEntries((resp.headers.get('x-batch-summary') || '').split(';').filter(Boolean).map(kv => kv.split('=')));
  el.innerHTML = `<p class="ok">已下载 ${name}：共 ${s.rows} 行，精确 ${s.exact}，不可精确达到 ${s.inexact}，错误 ${s.errors}，空白 ${s.empty}</p>`;
});
fetch('/api/config').then(r => r.text()).then(t => document.getElementById('cfg').textContent = t);
</script>
</body>
</html>
