# 劳务报酬计算工具 —— 默认税务口径配置
# 所有金额/比率请用字符串书写（如 "0.01"），以保证十进制精确，避免浮点误差。
# 每一项口径的含义与“需确认”说明见 docs/ASSUMPTIONS.md。

[rounding]
# 金额保留小数位（2 = 分）
scale = 2
# 舍入方式：half_up（四舍五入，远离零，MidpointAwayFromZero）| half_even（银行家舍入）| down（截断）| up（进位）
mode = "half_up"
# 附加税舍入：per_item（每个税目分别舍入后相加）| total（合计后一次舍入）
surcharge = "per_item"

[cost]
# 企业总成本口径（假设 A，需确认）：
#   vat_inclusive                = 总成本 = 价税合计 = 不含税收入 + 增值税
#   vat_and_surcharge_inclusive  = 总成本 = 不含税收入 + 增值税 + 附加税
basis = "vat_inclusive"

[vat]
# 增值税征收率（需确认：3% 或减按 1%）
rate = "0.01"
# 起征点（需确认）：默认不启用
threshold_enabled = false
# 起征点金额（按次或按月由使用方决定，本工具按“每次计算的销售额”判断）
threshold = "500"
# false：销售额 < 起征点 免征（“未达到起征点”）；true：销售额 ≤ 起征点 免征
threshold_inclusive = false

[surcharge]
# 附加税计税基数（假设 B，需确认）：vat（增值税额，法定口径）| net_revenue（不含税开票收入）
base = "vat"
# 是否对所有附加税目减半征收（“六税两费”减征，需确认）
halve = false

# 附加税目列表。默认按统筹方要求用一个合计税率 3%（需确认）。
# 如需分项，可改为：城市维护建设税 0.07/0.05/0.01、教育费附加 0.03、地方教育附加 0.02。
[[surcharge.items]]
name = "附加税"
rate = "0.03"

[iit]
# 个税收入额基数（假设 C，需确认）：net_revenue（不含税收入）| total_cost（企业总成本）
income_base = "net_revenue"
# 计算个税收入时是否先扣除附加税（需确认）
deduct_surcharge = false
# 劳务报酬预扣预缴：每次收入 ≤ 4000 元减除费用 800 元；> 4000 元减除 20%
fixed_deduction_limit = "4000"
fixed_deduction = "800"
percent_deduction_rate = "0.2"

# 预扣率表（劳务报酬所得预扣预缴，按应纳税所得额；upper 为含本数的上限，最后一档不写 upper）
[[iit.brackets]]
upper = "20000"
rate = "0.2"
quick_deduction = "0"

[[iit.brackets]]
upper = "50000"
rate = "0.3"
quick_deduction = "2000"

[[iit.brackets]]
rate = "0.4"
quick_deduction = "7000"

[take_home]
# 实际到手 = 不含税收入 − 附加税（若 deduct_surcharge）− 代扣个税（假设 D，需确认）
deduct_surcharge = true

[reverse]
# 多个企业总成本都能精确得到同一到手金额时的取值：min_cost（取最小总成本）| max_cost
prefer = "min_cost"
# 二分定位后在其前后各扫描多少个最小单位（分）做校准
search_window = 20
# 反算搜索的企业总成本上限
max_cost = "10000000000"
