# 劳务报酬计算工具 —— 默认计算参数
# 所有金额/比率请用字符串书写（如 "0.01"），以保证十进制精确，避免浮点误差。
# 每一项参数的含义、依据与确认状态见 docs/ASSUMPTIONS.md，用语对照见 docs/TERMINOLOGY.md。
#
# 核心变量：不含增值税收入 I（劳务报酬的每次收入，不含增值税；用户已确认）
#   增值税税额         = I 达到起征点 ? round(I × 征收率) : 0
#   增值税附加税费     = Σ 已启用项目 round(增值税税额 × 费率 × (1 − 减征比例))
#   企业总支出         = I + 增值税税额 + 增值税附加税费
#   应预扣预缴税额     按 I 计算（居民个人劳务报酬所得预扣预缴）
#   税后实发金额       = I − 应预扣预缴税额

[rounding]
# 金额保留小数位（2 = 分）
scale = 2
# 舍入方式：half_up（四舍五入，远离零，MidpointAwayFromZero）| half_even（银行家舍入）| down（截断）| up（进位）
mode = "half_up"
# 附加税费舍入：per_item（各项目分别按分舍入后相加，默认）| total（合计后一次舍入）
surcharge = "per_item"

[vat]
# 增值税征收率：当前按 1% 优惠征收率（小规模纳税人 3% 征收率减按 1%，
# 财政部 税务总局公告2026年第10号第三条第（三）项第6点，执行至 2027-12-31；用户已确认）。可改为 0.03 等。
rate = "0.01"
# 增值税起征点（按次纳税：每次（日）销售额 1000 元，财政部 税务总局公告2026年第10号第一条第（二）项）。
# 按不含增值税收入判断；未达到起征点时增值税及附加税费均为 0，个人所得税不受影响。
threshold_enabled = true
threshold = "1000"
# 恰好等于起征点时是否征收：true = 达到即征收（含本数，默认）；false = 超过才征收
levy_at_threshold = true

[surcharge]
# 增值税附加税费的计税依据：vat（实际缴纳的增值税税额，法定口径；用户已确认）| net_revenue（不含增值税收入）
base = "vat"
# 减征（如“六税两费”减半征收，财政部 税务总局公告2023年第12号）：默认不启用。
# 是否适用由使用者根据自身情况判断；relief_rate 为减征比例，0.5 即减半。此项为可配置假设。
relief_enabled = false
relief_rate = "0.5"

# 附加税费项目，各项以增值税税额为计税依据，分别按分舍入，合计为增值税附加税费。
# 用户已确认：当前仅计征教育费附加 3%。城市维护建设税（7%/5%/1%，按纳税人所在地）
# 与地方教育附加（2%）默认不启用，可在设置中开启并填写费率。
[[surcharge.items]]
name = "城市维护建设税"
rate = "0"
enabled = false

[[surcharge.items]]
name = "教育费附加"
rate = "0.03"
enabled = true

[[surcharge.items]]
name = "地方教育附加"
rate = "0"
enabled = false

[iit]
# 居民个人劳务报酬所得预扣预缴个人所得税（国家税务总局公告2018年第61号第八条及《个人所得税预扣率表二》），按不含增值税收入计算
# 每次收入不超过 4000 元的，减除费用按 800 元计算；4000 元以上的，减除费用按收入的 20% 计算
fixed_deduction_limit = "4000"
fixed_deduction = "800"
percent_deduction_rate = "0.2"

# 预扣率表（按预扣预缴应纳税所得额；upper 为含本数的上限，最后一档不写 upper）
[[iit.brackets]]
upper = "20000"
rate = "0.2"
quick_deduction = "0"

[[iit.brackets]]
upper = "50000"
rate = "0.3"
quick_deduction = "2000"

[[iit.brackets]]
rate = "0.4"
quick_deduction = "7000"

[reverse]
# 多个不含增值税收入均可精确得到同一税后实发金额时的取值：min_cost（取最小收入，即最小企业总支出）| max_cost
prefer = "min_cost"
# 二分定位后在其前后各扫描多少个最小单位（分）做校准
search_window = 20
# 测算时不含增值税收入的搜索上限
max_net_income = "10000000000"
