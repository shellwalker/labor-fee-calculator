# 劳务报酬计算工具 —— 默认计算参数
# 所有金额/比率请用字符串书写（如 "0.01"），以保证十进制精确，避免浮点误差。
# 每一项参数的含义、依据与确认状态见 docs/ASSUMPTIONS.md，用语对照见 docs/TERMINOLOGY.md。
#
# 核心变量：不含增值税收入 I（劳务报酬的每次收入，不含增值税；用户已确认）
#   增值税税额         = I 达到起征点 ? round(I × 征收率) : 0
#   增值税附加税费     = Σ 已征收项目 round(增值税税额 × 法定费率 × (1 − 减征比例))（不征收的项目不参与计算）
#   企业总支出         = I + 增值税税额 + 增值税附加税费
#   应预扣预缴税额     按 I 计算（居民个人劳务报酬所得预扣预缴）
#   税后实发金额       = I − 应预扣预缴税额

[rounding]
# 金额保留小数位（2 = 分）
scale = 2
# 舍入方式：half_up（四舍五入，远离零，MidpointAwayFromZero）| half_even（银行家舍入）| down（截断）| up（进位）
mode = "half_up"
# 附加税费舍入：per_item（各项目分别按分舍入后相加，默认）| total（合计后一次舍入）
surcharge = "per_item"

[vat]
# 增值税征收率：当前按 1% 优惠征收率（小规模纳税人 3% 征收率减按 1%，
# 财政部 税务总局公告2026年第10号第三条第（三）项第6点，执行至 2027-12-31；用户已确认）。可改为 0.03 等。
rate = "0.01"
# 增值税起征点（按次纳税：每次（日）销售额 1000 元，财政部 税务总局公告2026年第10号第一条第（二）项）。
# 按不含增值税收入判断；未达到起征点时增值税及附加税费均为 0，个人所得税不受影响。
threshold_enabled = true
threshold = "1000"
# 恰好等于起征点时是否征收：true = 达到即征收（含本数，默认）；false = 超过才征收
levy_at_threshold = true

[surcharge]
# 增值税附加税费的计税依据：vat（实际缴纳的增值税税额，法定口径；用户已确认）| net_revenue（不含增值税收入）
base = "vat"
# 减征优惠（“六税两费”减半征收）：对已征收的各项目统一适用，实际征收率 = 法定费率 × (1 − 减征比例)。
# 依据：财政部 税务总局公告2023年第12号第二条，2023-01-01 至 2027-12-31 对增值税小规模纳税人减半征收
# 城市维护建设税、教育费附加、地方教育附加；自然人不办理一般纳税人登记，代开发票时可按小规模纳税人享受
# （国家税务总局“六税两费”减免政策问答第10问）。旧版 halve = true/false 读入时映射为本组字段。
relief_enabled = true
relief_rate = "0.5"

# 城市维护建设税：按纳税人所在地分档（城市维护建设税法第四条），各档税率可修改。
# region：urban（市区，7%）| county_town（县城、镇，5%）| other（不在市区、县城或者镇，1%）。
# 用户已确认：默认档位 other（1%）。写明 region 时，城市维护建设税项目的税率取该档税率；
# 未写本段或未写 region 的旧配置，按项目税率匹配档位（已写 7% / 5% 的保持原值）。
[surcharge.urban_construction]
region = "other"
urban = "0.07"
county_town = "0.05"
other = "0.01"

# 附加税费项目，各项以增值税税额为计税依据，分别按分舍入，合计为增值税附加税费。
# 用户已确认：三项默认均征收（enabled = true）；不征收的项目改为 enabled = false（或在设置中选“征收：否”）。
# 默认合计比例 1% + 3% + 2% = 6%，减半后实际 3%。
# 城市维护建设税：税率取上面 [surcharge.urban_construction] 所选档位的税率（默认 1%）。
[[surcharge.items]]
name = "城市维护建设税"
rate = "0.01"
enabled = true

[[surcharge.items]]
name = "教育费附加"
rate = "0.03"
enabled = true

[[surcharge.items]]
# 地方教育附加：征收标准 2%（财综〔2010〕98号）
name = "地方教育附加"
rate = "0.02"
enabled = true

[iit]
# 居民个人劳务报酬所得预扣预缴个人所得税（国家税务总局公告2018年第61号第八条及《个人所得税预扣率表二》），按不含增值税收入计算
# 每次收入不超过 4000 元的，减除费用按 800 元计算；4000 元以上的，减除费用按收入的 20% 计算
fixed_deduction_limit = "4000"
fixed_deduction = "800"
percent_deduction_rate = "0.2"

# 预扣率表（按预扣预缴应纳税所得额；upper 为含本数的上限，最后一档不写 upper）
[[iit.brackets]]
upper = "20000"
rate = "0.2"
quick_deduction = "0"

[[iit.brackets]]
upper = "50000"
rate = "0.3"
quick_deduction = "2000"

[[iit.brackets]]
rate = "0.4"
quick_deduction = "7000"

[reverse]
# 多个不含增值税收入均可精确得到同一税后实发金额时的取值：min_cost（取最小收入，即最小企业总支出）| max_cost
prefer = "min_cost"
# 二分定位后在其前后各扫描多少个最小单位（分）做校准
search_window = 20
# 测算时不含增值税收入的搜索上限
max_net_income = "10000000000"
