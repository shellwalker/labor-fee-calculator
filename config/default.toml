# 劳务报酬计算工具 —— 默认税务口径配置
# 所有金额/比率请用字符串书写（如 "0.01"），以保证十进制精确，避免浮点误差。
# 每一项口径的含义、出处与确认状态见 docs/ASSUMPTIONS.md。
#
# 核心变量：不含税收入 I（未计增值税的劳务报酬收入，用户已确认）
#   增值税   = I ≥ 1000 ? round(I × 1%) : 0
#   附加税   = round(增值税 × 3%)
#   企业总成本 = I + 增值税 + 附加税
#   代扣个税 按 I 计算（居民个人劳务报酬预扣预缴）
#   实际到手 = I − 代扣个税

[rounding]
# 金额保留小数位（2 = 分）
scale = 2
# 舍入方式：half_up（四舍五入，远离零，MidpointAwayFromZero）| half_even（银行家舍入）| down（截断）| up（进位）
mode = "half_up"
# 附加税舍入：per_item（每个税目分别舍入后相加）| total（合计后一次舍入）
surcharge = "per_item"

[vat]
# 增值税 = round(不含税收入 × rate)（用户已确认 1%）
rate = "0.01"
# 征收门槛（用户指定口径，不是增值税法定起征点）：不含税收入 ≥ 1000 才征收增值税和附加税。
# 个税不受此门槛影响。
threshold_enabled = true
threshold = "1000"
# 不含税收入恰好等于门槛时是否征收：true = “≥ 门槛征收”（含本数，默认）；false = “> 门槛才征收”
levy_at_threshold = true

[surcharge]
# 附加税计税基数（用户已确认：按增值税额）：vat（增值税额）| net_revenue（不含税收入）
base = "vat"
# 是否对所有附加税目减半征收
halve = false

# 附加税目列表。用户已确认：附加税 = 增值税额 × 3%（一个合计税率）。
# 如需分项，可改为：城市维护建设税 0.07/0.05/0.01、教育费附加 0.03、地方教育附加 0.02。
[[surcharge.items]]
name = "附加税"
rate = "0.03"

[iit]
# 劳务报酬个税（居民个人预扣预缴，依据国家税务总局公告 2018 年第 61 号第八条及预扣率表二），按不含税收入计算
# 每次收入 ≤ 4000 元减除费用 800 元；> 4000 元减除 20%
fixed_deduction_limit = "4000"
fixed_deduction = "800"
percent_deduction_rate = "0.2"

# 预扣率表（劳务报酬所得预扣预缴，按应纳税所得额；upper 为含本数的上限，最后一档不写 upper）
[[iit.brackets]]
upper = "20000"
rate = "0.2"
quick_deduction = "0"

[[iit.brackets]]
upper = "50000"
rate = "0.3"
quick_deduction = "2000"

[[iit.brackets]]
rate = "0.4"
quick_deduction = "7000"

[reverse]
# 多个不含税收入都能精确得到同一到手金额时的取值：min_cost（取最小不含税收入，即最小总成本）| max_cost
prefer = "min_cost"
# 二分定位后在其前后各扫描多少个最小单位（分）做校准
search_window = 20
# 反算搜索的不含税收入上限
max_net_income = "10000000000"
